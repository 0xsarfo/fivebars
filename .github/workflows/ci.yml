name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile fivebars.py netprobe.py
      - name: Parser unit tests
        run: python tests/test_netprobe.py -v
      - name: End-to-end smoke test
        run: python tests/smoke.py

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: dist/Fivebars.app/Contents/MacOS/Fivebars
            artifact: Fivebars-macOS
          - os: windows-latest
            binary: dist/Fivebars.exe
            artifact: Fivebars-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm packaging/fivebars.spec
      - name: Smoke-test the packaged app
        run: python tests/smoke.py ${{ matrix.binary }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Fivebars.app ../Fivebars-macOS.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Fivebars.exe -DestinationPath Fivebars-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*/*.zip \
            --repo "${{ github.repository }}" --title "Fivebars ${{ github.ref_name }}" --generate-notes
